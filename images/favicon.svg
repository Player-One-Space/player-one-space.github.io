<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="12" fill="#0a0e1a"/>
  <!-- Satellite body -->
  <rect x="26" y="22" width="12" height="20" rx="2" fill="#a0aec0"/>
  <!-- Solar panel left -->
  <rect x="6" y="28" width="18" height="8" rx="1" fill="#cbd5e1"/>
  <line x1="10" y1="28" x2="10" y2="36" stroke="#0a0e1a" stroke-width="0.8"/>
  <line x1="14" y1="28" x2="14" y2="36" stroke="#0a0e1a" stroke-width="0.8"/>
  <line x1="18" y1="28" x2="18" y2="36" stroke="#0a0e1a" stroke-width="0.8"/>
  <!-- Solar panel right -->
  <rect x="40" y="28" width="18" height="8" rx="1" fill="#cbd5e1"/>
  <line x1="44" y1="28" x2="44" y2="36" stroke="#0a0e1a" stroke-width="0.8"/>
  <line x1="48" y1="28" x2="48" y2="36" stroke="#0a0e1a" stroke-width="0.8"/>
  <line x1="52" y1="28" x2="52" y2="36" stroke="#0a0e1a" stroke-width="0.8"/>
  <!-- Antenna -->
  <line x1="32" y1="22" x2="32" y2="14" stroke="#a0aec0" stroke-width="1.5"/>
  <circle cx="32" cy="12" r="2.5" fill="#a0aec0"/>
  <!-- Signal waves -->
  <path d="M 26 10 Q 22 6 26 2" fill="none" stroke="#a0aec0" stroke-width="1" opacity="0.5"/>
  <path d="M 38 10 Q 42 6 38 2" fill="none" stroke="#a0aec0" stroke-width="1" opacity="0.5"/>
  <!-- Orbit arc -->
  <ellipse cx="32" cy="48" rx="20" ry="6" fill="none" stroke="#a0aec0" stroke-width="0.8" opacity="0.3" stroke-dasharray="3 2"/>
</svg>