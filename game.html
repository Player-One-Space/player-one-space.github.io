    <style>
        .game-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: calc(var(--nav-height) + 1rem);
            min-height: 100vh;
            padding-left: 1rem;
            padding-right: 1rem;
        }
        canvas {
            border: 1px solid var(--border);
            border-radius: 8px;
            display: block;
            background: #05080f;
            width: 100%;
            max-width: 720px;
            touch-action: none;
        }
        .game-info {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 720px;
            padding: 0.75rem 0;
            font-family: 'Press Start 2P', cursive;
            font-size: 0.55rem;
            color: var(--text-secondary);
        }
        .game-score { color: var(--accent); font-weight: 400; }
        .game-controls {
            color: var(--text-secondary);
            font-size: 0.75rem;
            margin-top: 0.5rem;
            text-align: center;
        }
        .game-controls kbd {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 0.15rem 0.5rem;
            font-family: inherit;
            font-size: 0.75rem;
        }
        .game-container {
            position: relative;
            width: 100%;
            max-width: 720px;
        }
        /* Mobile touch controls */
        .touch-controls {
            display: none;
            width: 100%;
            max-width: 720px;
            margin-top: 1rem;
            gap: 0.75rem;
        }
        .touch-row {
            display: flex;
            justify-content: space-between;
            gap: 0.75rem;
        }
        .touch-btn {
            flex: 1;
            padding: 1.2rem;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-primary);
            font-family: 'Press Start 2P', cursive;
            font-size: 0.7rem;
            text-align: center;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        .touch-btn:active {
            background: var(--accent);
            color: var(--bg-primary);
        }
        .touch-btn-fire {
            background: rgba(160, 174, 192, 0.15);
            border-color: var(--accent);
        }
        @media (pointer: coarse) {
            .touch-controls { display: flex; flex-direction: column; }
            .game-controls { display: none; }
        }
        @media (max-width: 480px) {
            .game-info { font-size: 0.45rem; }
        }

    <script src="js/main.js"></script>
    <script>
    (function() {
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const W = canvas.width;
        const H = canvas.height;
        const FONT = "'Press Start 2P', monospace";

        // Audio engine (Web Audio API — no files needed)
        let audioCtx;
        function ensureAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSound(type) {
            try {
                ensureAudio();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                const now = audioCtx.currentTime;

                switch (type) {
                    case 'shoot':
                        osc.type = 'square';
                        osc.frequency.setValueAtTime(880, now);
                        osc.frequency.exponentialRampToValueAtTime(440, now + 0.1);
                        gain.gain.setValueAtTime(0.12, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
                        osc.start(now);
                        osc.stop(now + 0.1);
                        break;
                    case 'hit':
                        osc.type = 'square';
                        osc.frequency.setValueAtTime(300, now);
                        osc.frequency.exponentialRampToValueAtTime(100, now + 0.15);
                        gain.gain.setValueAtTime(0.15, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
                        osc.start(now);
                        osc.stop(now + 0.15);
                        break;
                    case 'playerHit':
                        osc.type = 'sawtooth';
                        osc.frequency.setValueAtTime(200, now);
                        osc.frequency.exponentialRampToValueAtTime(50, now + 0.4);
                        gain.gain.setValueAtTime(0.2, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
                        osc.start(now);
                        osc.stop(now + 0.4);
                        // Add noise burst
                        const noise = audioCtx.createOscillator();
                        const ng = audioCtx.createGain();
                        noise.connect(ng);
                        ng.connect(audioCtx.destination);
                        noise.type = 'square';
                        noise.frequency.setValueAtTime(80, now);
                        noise.frequency.setValueAtTime(120, now + 0.1);
                        noise.frequency.setValueAtTime(60, now + 0.2);
                        ng.gain.setValueAtTime(0.15, now);
                        ng.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
                        noise.start(now);
                        noise.stop(now + 0.35);
                        break;
                    case 'gameOver':
                        osc.type = 'square';
                        osc.frequency.setValueAtTime(440, now);
                        osc.frequency.setValueAtTime(370, now + 0.2);
                        osc.frequency.setValueAtTime(330, now + 0.4);
                        osc.frequency.setValueAtTime(262, now + 0.6);
                        gain.gain.setValueAtTime(0.15, now);
                        gain.gain.setValueAtTime(0.15, now + 0.6);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.9);
                        osc.start(now);
                        osc.stop(now + 0.9);
                        break;
                    case 'levelUp':
                        osc.type = 'square';
                        osc.frequency.setValueAtTime(523, now);
                        osc.frequency.setValueAtTime(659, now + 0.1);
                        osc.frequency.setValueAtTime(784, now + 0.2);
                        osc.frequency.setValueAtTime(1047, now + 0.3);
                        gain.gain.setValueAtTime(0.12, now);
                        gain.gain.setValueAtTime(0.12, now + 0.35);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
                        osc.start(now);
                        osc.stop(now + 0.5);
                        break;
                    case 'start':
                        osc.type = 'square';
                        osc.frequency.setValueAtTime(262, now);
                        osc.frequency.setValueAtTime(330, now + 0.08);
                        osc.frequency.setValueAtTime(392, now + 0.16);
                        osc.frequency.setValueAtTime(523, now + 0.24);
                        gain.gain.setValueAtTime(0.12, now);
                        gain.gain.setValueAtTime(0.12, now + 0.3);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
                        osc.start(now);
                        osc.stop(now + 0.4);
                        break;
                }
            } catch (e) { /* audio not supported — silent fallback */ }
        }

        // Game state
        let state = 'idle'; // idle, playing, paused, gameover
        let score = 0;
        let lives = 3;
        let level = 1;
        let player, bullets, invaders, invaderBullets, invaderDir, invaderSpeed;
        let stars = [];
        let titleBlink = 0;

        // Stars background
        for (let i = 0; i < 120; i++) {
            stars.push({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.5 + 0.5, s: Math.random() * 0.3 + 0.1 });
        }

        // Input
        const keys = {};
        document.addEventListener('keydown', e => {
            keys[e.code] = true;
            if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
            if (e.code === 'Enter') {
                if (state === 'idle' || state === 'gameover') { ensureAudio(); startGame(); }
            }
            if (e.code === 'KeyP' && state === 'playing') state = 'paused';
            else if (e.code === 'KeyP' && state === 'paused') state = 'playing';
        });
        document.addEventListener('keyup', e => { keys[e.code] = false; });

        // Touch controls
        function bindTouch(id, code) {
            const el = document.getElementById(id);
            if (!el) return;
            el.addEventListener('touchstart', e => { e.preventDefault(); keys[code] = true; }, { passive: false });
            el.addEventListener('touchend', e => { e.preventDefault(); keys[code] = false; }, { passive: false });
            el.addEventListener('mousedown', e => { keys[code] = true; });
            el.addEventListener('mouseup', e => { keys[code] = false; });
        }
        bindTouch('touch-left', 'ArrowLeft');
        bindTouch('touch-right', 'ArrowRight');
        bindTouch('touch-fire', 'Space');
        document.getElementById('touch-start').addEventListener('touchstart', e => {
            e.preventDefault();
            if (state === 'idle' || state === 'gameover') { ensureAudio(); startGame(); }
            else if (state === 'paused') state = 'playing';
            else if (state === 'playing') state = 'paused';
        }, { passive: false });
        document.getElementById('touch-start').addEventListener('click', () => {
            if (state === 'idle' || state === 'gameover') { ensureAudio(); startGame(); }
            else if (state === 'paused') state = 'playing';
            else if (state === 'playing') state = 'paused';
        });

        function startGame() {
            score = 0; lives = 3; level = 1;
            initLevel();
            state = 'playing';
            updateUI();
            playSound('start');
        }

        function initLevel() {
            player = { x: W / 2 - 20, y: H - 50, w: 40, h: 20, speed: 6, cooldown: 0 };
            bullets = [];
            invaderBullets = [];
            invaders = [];
            invaderDir = 1;
            invaderSpeed = 0.5 + level * 0.18;

            const rows = Math.min(3 + Math.floor(level / 2), 6);
            const cols = Math.min(7 + Math.floor(level / 3), 12);
            const invW = 34;
            const invH = 24;
            const gapX = 50;
            const gapY = 40;
            const totalW = cols * gapX;
            const offsetX = (W - totalW) / 2 + (gapX - invW) / 2;
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    invaders.push({
                        x: offsetX + c * gapX,
                        y: 50 + r * gapY,
                        w: invW,
                        h: invH,
                        alive: true,
                        type: r < 1 ? 2 : r < 3 ? 1 : 0
                    });
                }
            }
        }

        function updateUI() {
            document.getElementById('score').textContent = score;
            document.getElementById('lives').textContent = lives;
            document.getElementById('level').textContent = level;
        }

        function drawPixelShip(x, y, w, h) {
            ctx.fillStyle = '#a0aec0';
            ctx.fillRect(x + w * 0.3, y + h * 0.4, w * 0.4, h * 0.6);
            ctx.fillRect(x + w * 0.4, y, w * 0.2, h * 0.5);
            ctx.fillRect(x, y + h * 0.6, w * 0.25, h * 0.35);
            ctx.fillRect(x + w * 0.75, y + h * 0.6, w * 0.25, h * 0.35);
            ctx.fillStyle = '#f97316';
            ctx.fillRect(x + w * 0.38, y + h * 0.95, w * 0.24, h * 0.12);
        }

        function drawInvader(inv) {
            const { x, y, w, h, type } = inv;
            const colors = ['#22c55e', '#38bdf8', '#f472b6'];
            ctx.fillStyle = colors[type];
            if (type === 0) {
                ctx.fillRect(x + 4, y, w - 8, h);
                ctx.fillRect(x, y + 4, w, h - 8);
                ctx.fillRect(x + 4, y + 4, 5, 5);
                ctx.fillRect(x + w - 9, y + 4, 5, 5);
            } else if (type === 1) {
                ctx.fillRect(x + 2, y + 2, w - 4, h - 4);
                ctx.fillRect(x, y + 6, w, h - 10);
                ctx.fillRect(x + 6, y, 5, 5);
                ctx.fillRect(x + w - 11, y, 5, 5);
            } else {
                ctx.fillRect(x, y + 4, w, h - 8);
                ctx.fillRect(x + 4, y, w - 8, h);
                ctx.fillRect(x + 8, y + 4, 5, 5);
                ctx.fillRect(x + w - 13, y + 4, 5, 5);
            }
        }

        function update() {
            titleBlink++;
            if (state !== 'playing') return;

            if (keys['ArrowLeft'] && player.x > 0) player.x -= player.speed;
            if (keys['ArrowRight'] && player.x < W - player.w) player.x += player.speed;
            if (player.cooldown > 0) player.cooldown--;

            if (keys['Space'] && player.cooldown === 0) {
                bullets.push({ x: player.x + player.w / 2 - 2, y: player.y, w: 4, h: 12 });
                player.cooldown = 12;
                playSound('shoot');
            }

            bullets.forEach(b => b.y -= 7);
            bullets = bullets.filter(b => b.y > -12);

            let edgeHit = false;
            invaders.filter(i => i.alive).forEach(i => {
                i.x += invaderSpeed * invaderDir;
                if (i.x <= 0 || i.x + i.w >= W) edgeHit = true;
            });
            if (edgeHit) {
                invaderDir *= -1;
                invaders.filter(i => i.alive).forEach(i => { i.y += 18; });
            }

            const aliveInvaders = invaders.filter(i => i.alive);
            if (aliveInvaders.length > 0 && Math.random() < 0.012 + level * 0.004) {
                const shooter = aliveInvaders[Math.floor(Math.random() * aliveInvaders.length)];
                invaderBullets.push({ x: shooter.x + shooter.w / 2 - 2, y: shooter.y + shooter.h, w: 4, h: 12 });
            }
            invaderBullets.forEach(b => b.y += 4);
            invaderBullets = invaderBullets.filter(b => b.y < H + 12);

            bullets.forEach(b => {
                invaders.filter(i => i.alive).forEach(i => {
                    if (b.x < i.x + i.w && b.x + b.w > i.x && b.y < i.y + i.h && b.y + b.h > i.y) {
                        i.alive = false;
                        b.y = -100;
                        score += (i.type + 1) * 10;
                        updateUI();
                        playSound('hit');
                    }
                });
            });

            invaderBullets.forEach(b => {
                if (b.x < player.x + player.w && b.x + b.w > player.x && b.y < player.y + player.h && b.y + b.h > player.y) {
                    b.y = H + 100;
                    lives--;
                    updateUI();
                    if (lives <= 0) { state = 'gameover'; playSound('gameOver'); }
                    else playSound('playerHit');
                }
            });

            if (aliveInvaders.some(i => i.y + i.h >= player.y)) { state = 'gameover'; playSound('gameOver'); }

            if (aliveInvaders.length === 0) {
                level++;
                initLevel();
                updateUI();
                playSound('levelUp');
            }

            stars.forEach(s => {
                s.y += s.s;
                if (s.y > H) { s.y = 0; s.x = Math.random() * W; }
            });
        }

        function drawStars() {
            stars.forEach(s => {
                ctx.fillStyle = `rgba(255,255,255,${0.3 + s.r * 0.3})`;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        function draw() {
            ctx.fillStyle = '#05080f';
            ctx.fillRect(0, 0, W, H);
            drawStars();

            if (state === 'idle') {
                ctx.textAlign = 'center';

                // "READY" text
                ctx.fillStyle = '#a0aec0';
                ctx.font = `20px ${FONT}`;
                ctx.fillText('READY', W / 2, H / 2 - 80);

                // "PLAYER ONE" large
                ctx.fillStyle = '#f0f0f0';
                ctx.font = `28px ${FONT}`;
                ctx.fillText('PLAYER ONE', W / 2, H / 2 - 30);

                // Blinking "PRESS START"
                if (Math.floor(titleBlink / 40) % 2 === 0) {
                    ctx.fillStyle = '#a0aec0';
                    ctx.font = `12px ${FONT}`;
                    ctx.fillText('PRESS ENTER OR TAP START', W / 2, H / 2 + 40);
                }

                // Credits
                ctx.fillStyle = '#4a5568';
                ctx.font = `8px ${FONT}`;
                ctx.fillText('PLAYER ONE SPACE EDITION', W / 2, H / 2 + 90);
                return;
            }

            if (state === 'gameover') {
                ctx.textAlign = 'center';
                ctx.fillStyle = '#f472b6';
                ctx.font = `24px ${FONT}`;
                ctx.fillText('GAME OVER', W / 2, H / 2 - 50);

                ctx.fillStyle = '#a0aec0';
                ctx.font = `12px ${FONT}`;
                ctx.fillText('SCORE ' + score, W / 2, H / 2 + 10);
                ctx.fillText('LEVEL ' + level, W / 2, H / 2 + 40);

                if (Math.floor(titleBlink / 40) % 2 === 0) {
                    ctx.font = `10px ${FONT}`;
                    ctx.fillText('PRESS ENTER TO RETRY', W / 2, H / 2 + 80);
                }
                return;
            }

            if (state === 'paused') {
                drawGameObjects();
                ctx.fillStyle = 'rgba(5, 8, 15, 0.75)';
                ctx.fillRect(0, 0, W, H);
                ctx.textAlign = 'center';
                ctx.fillStyle = '#f0f0f0';
                ctx.font = `20px ${FONT}`;
                ctx.fillText('PAUSED', W / 2, H / 2);
                ctx.fillStyle = '#a0aec0';
                ctx.font = `10px ${FONT}`;
                ctx.fillText('PRESS P TO RESUME', W / 2, H / 2 + 40);
                return;
            }

            drawGameObjects();
        }

        function drawGameObjects() {
            drawPixelShip(player.x, player.y, player.w, player.h);

            ctx.fillStyle = '#a0aec0';
            bullets.forEach(b => {
                ctx.fillRect(b.x, b.y, b.w, b.h);
                ctx.fillStyle = 'rgba(160, 174, 192, 0.3)';
                ctx.fillRect(b.x - 1, b.y, b.w + 2, b.h + 4);
                ctx.fillStyle = '#a0aec0';
            });

            invaders.filter(i => i.alive).forEach(i => drawInvader(i));

            ctx.fillStyle = '#f97316';
            invaderBullets.forEach(b => {
                ctx.fillRect(b.x, b.y, b.w, b.h);
            });
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    })();
    </script>
